<!DOCTYPE html>
<html>
<head>
    <title>Flask + Nginx Proxy Lab</title>
</head>
<body>
    <h1>{{ message }}</h1>
    <p>This page is rendered using Jinja2.</p>

    <p>API response:</p>
    <pre id="api"></pre>

    <script>
        fetch("/api/data")
            .then(r => r.json())
            .then(d => {
                document.getElementById("api").innerText = JSON.stringify(d, null, 2);
            });
    </script>
</body>
</html>
